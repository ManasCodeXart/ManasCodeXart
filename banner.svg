<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .banner-bg { fill: #ffffff; }
      .banner-title {
        font-family: 'Caveat', 'Segoe Script', 'Bradley Hand', cursive, sans-serif;
        font-size: 76px;
        fill: #111111;
      }
      .doodle { fill: none; stroke: #111111; stroke-width: 2.5; stroke-linecap: round; }
      .doodle-fill { fill: #111111; }

      .sparkle {
        transform-box: fill-box;
        transform-origin: center;
        animation: twinkle 1.6s ease-in-out infinite;
      }
      .sparkle.delay { animation-delay: 0.8s; }

      .underline {
        stroke-dasharray: 14 10;
        animation: dashflow 3s linear infinite;
      }

      .phone-wiggle {
        transform-box: fill-box;
        transform-origin: center;
        animation: wiggle 2.6s ease-in-out infinite;
      }
      .phone-wiggle.reverse { animation-direction: alternate-reverse; }

      @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.15); }
      }
      @keyframes dashflow {
        to { stroke-dashoffset: -48; }
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(4deg); }
      }
    </style>
  </defs>

  <!-- background -->
  <rect class="banner-bg" x="0" y="0" width="1200" height="300" />

  <!-- left phone doodle -->
  <g transform="translate(150,150) rotate(-12)">
    <g class="phone-wiggle">
      <rect class="doodle" x="-32" y="-65" width="64" height="130" rx="11" />
      <line class="doodle" x1="-32" y1="-42" x2="32" y2="-42" />
      <line class="doodle" x1="-18" y1="-15" x2="18" y2="-15" />
      <line class="doodle" x1="-18" y1="5" x2="18" y2="5" />
      <line class="doodle" x1="-18" y1="25" x2="6" y2="25" />
      <line class="doodle" x1="-14" y1="52" x2="14" y2="52" />
    </g>
  </g>

  <!-- right phone doodle -->
  <g transform="translate(1052,152) rotate(11)">
    <g class="phone-wiggle reverse">
      <rect class="doodle" x="-32" y="-65" width="64" height="130" rx="11" />
      <line class="doodle" x1="-32" y1="-42" x2="32" y2="-42" />
      <circle class="doodle-fill" cx="-14" cy="-10" r="7" />
      <line class="doodle" x1="2" y1="-10" x2="18" y2="-10" />
      <line class="doodle" x1="-18" y1="14" x2="18" y2="14" />
      <line class="doodle" x1="-14" y1="52" x2="14" y2="52" />
    </g>
  </g>

  <!-- sparkle accents -->
  <path class="doodle-fill sparkle" d="M 95 60 L 100 75 L 115 80 L 100 85 L 95 100 L 90 85 L 75 80 L 90 75 Z" />
  <path class="doodle-fill sparkle delay" d="M 1115 215 L 1119 226 L 1130 230 L 1119 234 L 1115 245 L 1111 234 L 1100 230 L 1111 226 Z" />

  <!-- title -->
  <text x="600" y="140" text-anchor="middle" class="banner-title">Building Mobile Apps</text>

  <!-- hand-drawn underline doodle -->
  <path class="doodle underline"
    d="M 375 188
       Q 415 168 455 188
       Q 495 208 535 188
       Q 575 168 615 188
       Q 655 208 695 188
       Q 735 168 775 188
       Q 800 198 825 190" />

  <!-- tagline -->
  <text x="600" y="240" text-anchor="middle"
        font-family="'Segoe UI', sans-serif" font-size="20" fill="#444444" letter-spacing="1">
    Mobile UI/UX Design · React Native · Fintech Interactions
  </text>
</svg>
