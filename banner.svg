<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .banner-bg { fill: #FFFFFF; }
      .banner-title {
        font-family: 'Caveat', 'Segoe Script', 'Bradley Hand', cursive, sans-serif;
        font-size: 80px;
        font-weight: 700;
        fill: #161616;
      }
      .tagline {
        font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
        font-size: 19px;
        fill: #6b6b6b;
        letter-spacing: 2.5px;
      }
      .doodle { fill: none; stroke: #161616; stroke-width: 2.5; stroke-linecap: round; }

      .accent-stroke { fill: none; stroke: #FF5A36; stroke-width: 2.5; stroke-linecap: round; }
      .accent-fill { fill: #FF5A36; }

      .underline {
        stroke-dasharray: 14 10;
        opacity: 0;
        animation: dashflow 3s linear infinite, fadein 0.6s ease-out 2.6s forwards;
      }

      .tagline-fade {
        opacity: 0;
        animation: fadein 0.8s ease-out 2.9s forwards;
      }

      @keyframes dashflow {
        to { stroke-dashoffset: -48; }
      }
      @keyframes fadein {
        to { opacity: 1; }
      }
    </style>

    <pattern id="dotgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#161616" opacity="0.05" />
    </pattern>

    <!-- clip rect that widens left-to-right to simulate the title being written -->
    <clipPath id="revealClip">
      <rect x="110" y="105" width="0" height="135">
        <animate attributeName="width" from="0" to="980" dur="2.3s" begin="0.3s"
                 fill="freeze" calcMode="spline" keySplines="0.3 0.05 0.2 1" />
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect class="banner-bg" x="0" y="0" width="1200" height="420" />
  <rect x="0" y="0" width="1200" height="420" fill="url(#dotgrid)" />

  <!-- title, revealed by the widening clip rect above -->
  <g clip-path="url(#revealClip)">
    <text x="600" y="200" text-anchor="middle" class="banner-title">Building Mobile Apps</text>
  </g>

  <!-- pencil nib that travels with the reveal edge -->
  <g transform="translate(110,185)">
    <animateTransform attributeName="transform" type="translate" from="110 185" to="1090 185"
                       dur="2.3s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.3 0.05 0.2 1" />
    <animate attributeName="opacity" from="1" to="0" begin="2.5s" dur="0.4s" fill="freeze" />
    <g transform="rotate(-50)">
      <line class="doodle" x1="-3" y1="-26" x2="3" y2="2" />
      <line class="doodle" x1="-3" y1="-26" x2="3" y2="-26" />
      <path class="accent-fill" d="M -3 2 L 3 2 L 0 9 Z" />
    </g>
  </g>

  <!-- hand-drawn underline doodle, appears once the writing finishes -->
  <path class="accent-stroke underline"
    d="M 375 248
       Q 415 228 455 248
       Q 495 268 535 248
       Q 575 228 615 248
       Q 655 268 695 248
       Q 735 228 775 248
       Q 800 258 825 250" />

  <!-- tagline -->
  <text x="600" y="300" text-anchor="middle" class="tagline tagline-fade">
    MOBILE UI/UX DESIGN · REACT NATIVE · INTERACTIONS
  </text>
</svg>
